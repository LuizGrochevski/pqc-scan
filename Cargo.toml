[package]
name = "pqc-scan"
version = "0.1.0"
edition = "2024"
description = "Audit TLS endpoints and X.509 certificates for quantum-vulnerable cryptography and PQC readiness"
license = "MIT"
readme = "README.md"
keywords = ["post-quantum", "pqc", "tls", "security", "x509"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
rustls = "0.23"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
x509-parser = "0.18.1"
